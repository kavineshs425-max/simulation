# =============================================================================
# Hydrodynamic drag / added-mass for my_boat
#   vrx::SimpleHydrodynamics / libSimpleHydrodynamics.so
# =============================================================================
# Same plugin VRX attaches to the WAM-V base_link. It implements Fossen's 6-DOF
# maritime model: added mass + linear and quadratic drag. Without it a buoyant
# hull bobs/oscillates forever; with it, disturbances (waves, wind, current,
# pushes) decay to rest -> required for Test 3 (equilibrium) and Test 7 (soak).
#
# Body-frame DOF (Fossen / VRX):
#   X = surge (fwd)    K = roll  (about X)
#   Y = sway  (port)   M = pitch (about Y)
#   Z = heave (up)     N = yaw   (about Z)
#
# Coefficient naming:
#   <dof>Dot<vel>   = added mass / added inertia  (NEGATIVE, Fossen sign)
#   <dof><vel>      = LINEAR drag
#   <dof><vel><vel> = QUADRATIC drag
#
# ASSUMPTIONS / METHOD
# --------------------
# These are engineering estimates, scaled from the VRX WAM-V defaults to this
# heavier (420 kg vs 180 kg) and longer (4.17 m) monohull, shaped to hull form:
#   * Broadside (sway/heave) drag > axial (surge) drag: a hull pushes much more
#     water sideways/vertically than along its length.
#   * Heave (zW/zWW) and pitch (mQ/mQQ) damping are the terms that settle
#     vertical bobbing and porpoising after a disturbance/wave.
#   * Yaw (nR/nRR) damping keeps heading bounded under wind/current.
#   * Added-mass magnitudes are kept BELOW the ~420 kg displaced-fluid mass to
#     avoid the negative-effective-mass numerical instability.
# Refine against tow-tank / spec data when available; all values are tunable
# here and applied automatically by the launch file.
# =============================================================================
hydrodynamics:
  link_name: my_boat/base_link

  # --- Added mass (negative) -------------------------------------------------
  xDotU: -20.0      # surge: small, slender end-on
  yDotV: -200.0     # sway:  large, broadside
  zDotW: -150.0     # heave: large, flat bottom
  kDotP: -20.0      # roll
  mDotQ: -200.0     # pitch
  nDotR: -100.0     # yaw

  # --- Linear drag -----------------------------------------------------------
  xU: 24.0     # surge: + linear_drag 0.2 x 86.5 = 41 u, the real boat (2026-10-07; was 150)
  yV: 556.0     # +156 = what linear_drag 2.0 -> 0.2 took away in sway (2026-10-07; was 400)
  zW: 956.0     # +156, same, heave (2026-10-07; was 800)
  kP: 150.0         # roll damping (keeps the wide hull from ringing in roll)
  mQ: 1000.0        # pitch damping
  # YAW DAMPING, CALIBRATED 2026-08-27 against the real vessel. Was 600/800.
  #
  # Damping torque here is  nR*r + nRR*|r|*r, so the effective tau/r was
  # 688 N.m.s/rad at r = 0.11. Every controller in the stack is designed
  # against dp_control_system_v2/config/vessel.yaml, which says D_yaw = 97.7.
  #
  # Measured in bag circle_diag_1514: the whole chain was working correctly.
  # velocity_controller output |tau_yaw| p90 117 N.m / max 190, tau_mux passed
  # it through unchanged, and the allocator DELIVERED 97% of it (p90 113 N.m,
  # max 172). The hull simply would not rotate: |r| max 0.150 rad/s, so a
  # 90 deg turn took 14.3 s. Implied damping 905 N.m.s/rad.
  #
  # Calibration target is what the REAL boat demonstrably did, not a guess:
  #   dp_test_real_10  sustained R = 4.5 m at 1.16 m/s  ->  r = 0.258 rad/s
  #                    peak 0.292 rad/s at 1.29 m/s
  # The sim was therefore 0.258/0.150 = 1.72x too sluggish in yaw. nR and nRR
  # are both scaled down by that factor, which preserves the linear/quadratic
  # balance rather than re-shaping the curve.
  #
  # Added mass nDotR is left alone: it sets the transient, not the
  # steady-state rate, and the fault measured was steady-state.
  #
  # VERIFY on the next run: |r| should reach ~0.27 rad/s at the 117 N.m p90
  # demand and a 90 deg turn should take ~6 s, not 14. If it overshoots the
  # real vessel's 0.29 rad/s peak, these are too low.
  nR: 340.0         # yaw damping (was 600.0)

  # --- Quadratic drag --------------------------------------------------------
  xUU: 165.5     # surge quadratic: the real boat F ~ 191 v^1.98 (2026-10-07; was 200)
  yVV: 600.0
  zWW: 1000.0
  kPP: 200.0
  mQQ: 1200.0
  nRR: 460.0        # yaw quadratic damping (was 800.0)
