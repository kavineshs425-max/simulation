# World coordinates (Gazebo ENU): x east, y north, heading_deg 0 = east, 90 = north.
# Obstacles spawn at "start" and HOLD STILL until you call
#   ros2 service call /obstacle_spawner/run std_srvs/srv/Trigger
#
# Rule 13, a faster vessel overtakes US from astern, passing 6 m to port.
# design: {own_speed: 1.4, own_heading_deg: 0, tcpa: 40.0, dcpa: 6.0}
scenario: {name: being_overtaken}
obstacles:
  - name: fast_boat
    model: brazilian
    vessel_class: power_driven
    start: {x: -572.0, y: 192.0, heading_deg: 0.0}
    motion: {type: constant_velocity, speed: 2.5}
