# World coordinates (Gazebo ENU): x east, y north, heading_deg 0 = east, 90 = north.
# Obstacles spawn at "start" and HOLD STILL until you call
#   ros2 service call /obstacle_spawner/run std_srvs/srv/Trigger
#
# Rule 13, WE overtake a slow vessel 54 m ahead on the same course.
# design: {own_speed: 1.4, own_heading_deg: 0, tcpa: 60.0, dcpa: 0.0}
scenario: {name: overtaking}
obstacles:
  - name: slow_boat
    model: bass_boat
    vessel_class: power_driven
    start: {x: -474.0, y: 186.0, heading_deg: 0.0}
    motion: {type: constant_velocity, speed: 0.5}
