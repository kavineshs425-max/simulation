# World coordinates (Gazebo ENU): x east, y north, heading_deg 0 = east, 90 = north.
# Obstacles spawn at "start" and HOLD STILL until you call
#   ros2 service call /obstacle_spawner/run std_srvs/srv/Trigger
#
# Every vessel model at once, each doing something different.
# design: {own_speed: 1.4, own_heading_deg: 0, obstacle: yacht_head_on, tcpa: 70.0, dcpa: 12.0}
# design: {own_speed: 1.4, own_heading_deg: 0, obstacle: bass_crossing, tcpa: 40.0, dcpa: -6.0}
scenario: {name: harbour_mix, duration_s: 900}
obstacles:
  - name: yacht_head_on         # passes 12 m to port, 70 s after run
    model: freedom_365
    vessel_class: power_driven
    start: {x: -303.9, y: 187.0, heading_deg: 175.0}
    motion: {type: constant_velocity, speed: 1.8}
  - name: bass_crossing         # crosses from starboard, passes 6 m to starboard at 40 s
    model: bass_boat
    vessel_class: power_driven
    start: {x: -467.22, y: 133.89, heading_deg: 100.0}
    motion: {type: constant_velocity, speed: 1.2}
  - name: fisher_circling
    model: brazilian
    vessel_class: fishing
    start: {x: -468.0, y: 211.0, heading_deg: -90.0}
    motion: {type: constant_turn, speed: 0.7, turn_rate_deg_s: -2.5}
  - name: kayak_patrol
    model: kayak
    motion:
      type: waypoints
      speed: 0.8
      loop: true
      points: [[-498.0, 171.0], [-473.0, 171.0], [-473.0, 156.0], [-498.0, 156.0]]
  - {name: mark_buoy, model: buoy, start: {x: -478.0, y: 186.0}}
