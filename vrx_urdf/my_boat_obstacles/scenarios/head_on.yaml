# World coordinates (Gazebo ENU): x east, y north, heading_deg 0 = east, 90 = north.
# Obstacles spawn at "start" and HOLD STILL until you call
#   ros2 service call /obstacle_spawner/run std_srvs/srv/Trigger
#
# Rule 14 head-on. Designed for my_boat at its default spawn (-528, 186) running
# EAST at 1.4 m/s from the moment of run: collision course, CPA 50 s after run.
# design: {own_speed: 1.4, own_heading_deg: 0, tcpa: 50.0, dcpa: 0.0}
scenario: {name: head_on}
obstacles:
  - name: oncoming
    model: brazilian
    vessel_class: power_driven
    start: {x: -383.0, y: 186.0, heading_deg: 180.0}
    motion: {type: constant_velocity, speed: 1.5}
